server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the API at request time (via a variable)
    # lets nginx start even when the API container isn't up yet.
    resolver 127.0.0.11 valid=30s;

    # The API routes already start with /api, so the URI is forwarded unchanged.
    location /api/ {
        set $api_upstream http://task-manager-api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown paths are handled by the client-side router.
    location / {
        try_files $uri /index.html;
    }
}
